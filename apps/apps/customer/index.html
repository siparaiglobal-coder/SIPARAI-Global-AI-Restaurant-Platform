<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIPARAI - منصة المطاعم العالمية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      margin-right: 5px;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background: white;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #667085;
      margin-bottom: 25px;
    }

    .search {
      max-width: 650px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search input {
      flex: 1;
      padding: 15px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
    }

    .search button,
    .ai-button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      cursor: pointer;
      font-weight: bold;
    }

    .search button {
      background: #111827;
      color: white;
    }

    .section {
      padding: 35px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .category {
      background: white;
      padding: 22px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .category div {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .ai-box {
      margin-top: 25px;
      background: #111827;
      color: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }

    .ai-box p {
      margin: 12px 0 20px;
      color: #d1d5db;
    }

    .ai-button {
      background: white;
      color: #111827;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #667085;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 30px;
      }

      .search {
        flex-direction: column;
      }

      .search button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">SIPARAI <span>🚀🌍</span></div>
    <div>عالميًا</div>
  </header>

  <section class="hero">
    <h1>اكتشف عالم المطاعم مع SIPARAI</h1>

    <p>
      منصة مطاعم عالمية مدعومة بالذكاء الاصطناعي.
    </p>

    <div class="search">
      <input
        type="text"
        placeholder="ابحث عن مطعم أو وجبة..."
      >

      <button>بحث</button>
    </div>
  </section>

  <section class="section">

    <h2>استكشف حسب النوع</h2>

    <div class="categories">

      <div class="category">
        <div>🍔</div>
        برغر
      </div>

      <div class="category">
        <div>🍕</div>
        بيتزا
      </div>

      <div class="category">
        <div>🍗</div>
        دجاج
      </div>

      <div class="category">
        <div>🍣</div>
        سوشي
      </div>

      <div class="category">
        <div>🥗</div>
        صحي
      </div>

      <div class="category">
        <div>🌮</div>
        مكسيكي
      </div>

    </div>

    <div class="ai-box">

      <h2>🤖 تحدث مع موظف SIPARAI AI</h2>

      <p>
        دع الذكاء الاصطناعي يساعدك في اختيار المطعم والوجبة المناسبة لك.
      </p>

      <button class="ai-button">
        تحدث مع AI
      </button>

    </div>

  </section>

  <footer>
    © 2026 SIPARAI — Global AI Restaurant Platform
  </footer>
<script>
  const searchInput = document.querySelector(".search input");
  const searchButton = document.querySelector(".search button");
  const aiButton = document.querySelector(".ai-button");

  searchButton.addEventListener("click", function () {
    const query = searchInput.value.trim();

    if (!query) {
      alert("اكتب اسم مطعم أو وجبة أولًا 🍽️");
      return;
    }

    alert("SIPARAI يبحث عن: " + query + " 🔎");
  });

  searchInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      searchButton.click();
    }
  });

  aiButton.addEventListener("click", function () {
    alert(
      "🤖 موظف SIPARAI AI جاهز لمساعدتك!\n\n" +
      "في المرحلة القادمة سنربطه بالذكاء الاصطناعي الحقيقي."
    );
  });
</script>

</body>
